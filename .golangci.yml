version: "2"
linters:
  default: none
  enable:
    - bodyclose # checks whether HTTP response body is closed successfully.
    - canonicalheader # Canonicalheader checks whether net/http.Header uses canonical header.
    - containedctx # Detects struct contained context.Context field.
    - contextcheck # Check whether the function uses a non-inherited context.
    - copyloopvar # copyloopvar is a linter that detects places where loop variables are copied.
    - durationcheck # Check for two durations multiplied together (which should almost never happen).
    - err113 # Golang linter to check the errors handling expressions.
    - errcheck # Errcheck is a program for checking for unchecked errors in go programs. These unchecked errors can be critical bugs in some cases.
    - errname # Checks that sentinel errors are prefixed with the Err and error types are suffixed with the Error.
    - errorlint # errorlint is a linter for that can be used to find code that will cause problems with the error wrapping scheme introduced in Go 1.13.
    - fatcontext # Detects nested contexts in loops.
    - gocheckcompilerdirectives # Checks that go compiler directive comments (//go:) are valid.
    - gochecknoinits # Checks that no init functions are present in Go code.
    - gocritic # Provides many diagnostics that check for bugs, performance and style issues.
    - godot # Check if comments end in a period.
    - gomoddirectives # Manage the use of 'replace', 'retract', and 'excludes' directives in go.mod.
    - goprintffuncname # Checks that printf-like functions are named with f at the end.
    - gosmopolitan # Report certain i18n/l10n anti-patterns in your Go codebase.
    - govet # Vet examines Go source code and reports suspicious constructs, such as Printf calls whose arguments do not align with the format string.
    - iface # Detect the incorrect use of interfaces, helping developers avoid interface pollution.
    - ineffassign # Detects when assignments to existing variables are not used.
    - loggercheck # Checks key value pairs for common logger libraries (kitlog,klog,logr,zap).
    - mirror # reports wrong mirror patterns of bytes/strings usage.
    - mnd # An analyzer to detect magic numbers.
    - musttag # enforce field tags in (un)marshaled structs.
    - nakedret # Finds naked returns in functions greater than a specified function length.
    - nilerr # Finds the code that returns nil even if it checks that the error is not nil.
    - nilnil # Checks that there is no simultaneous return of nil error and an invalid value.
    - noctx # noctx finds sending http request without context.Context.
    - nosprintfhostport # Checks for misuse of Sprintf to construct a host with port in a URL.
    # - paralleltest # Detects missing usage of t.Parallel() method in your Go test.
    - perfsprint # Checks that fmt.Sprintf can be replaced with a faster alternative.
    - predeclared # find code that shadows one of Go's predeclared identifiers.
    - revive # Fast, configurable, extensible, flexible, and beautiful linter for Go. Drop-in replacement of golint.
    - sqlclosecheck # Checks that sql.Rows and sql.Stmt are closed.
    - staticcheck # Staticcheck is a go vet on steroids, applying a ton of static analysis checks.
    - tagliatelle # Checks the struct tags.
    - unconvert # Remove unnecessary type conversions.
    - unused # Checks Go code for unused constants, variables, functions and types.
    - usestdlibvars # A linter that detect the possibility to use variables/constants from the Go standard library.
    - whitespace # Tool for detection of leading and trailing whitespace.
    - wrapcheck # Checks that errors returned from external packages are wrapped
  settings:
    errcheck:
      check-type-assertions: true # report about not checking of errors in type assertions: `a := b.(MyStruct)`;
      check-blank: true # report about assignment of errors to blank identifier: `num, _ := strconv.Atoi(numStr)`;

    errorlint:
      errorf: true # Check whether fmt.Errorf uses the %w verb for formatting errors. See the readme for caveats
      asserts: true # Check for plain type assertions and type switches
      comparison: true # Check for plain error comparisons

    gocritic:
      enabled-checks:
        - importShadow # Detects when imported package names shadowed in the assignments
        - whyNoLint # Ensures that `//nolint` comments include an explanation

    gomoddirectives:
      replace-local: true # disabling local module replace check

    govet:
      enable:
        - nilness # Check for redundant or impossible nil comparisons.
        - unusedwrite # Checks for unused writes.
        - waitgroup # Checks for misuses of sync.WaitGroup.
        - shadow # Check for possible unintended shadowing of variables.

    revive:
      severity: warning
      confidence: 0.6
      rules:
        - name: atomic # Check for commonly mistaken usages of the sync/atomic package
        - name: bare-return # Warns on bare (a.k.a. naked) returns
        - name: blank-imports # Blank import should be only in a main or test package, or have a comment justifying it.
        - name: call-to-gc # Explicitly invoking the garbage collector is, except for specific uses in benchmarking, very dubious.
        - name: confusing-naming # Methods or fields of struct that have names different only by capitalization could be confusing.
        - name: confusing-results # Function or methods that return multiple, no named, values of the same type could induce error.
        - name: constant-logical-expr # The rule spots logical expressions that evaluate always to the same value.
        - name: context-as-argument # By convention, context.Context should be the first parameter of a function. This rule spots function declarations that do not follow the convention.
          severity: error
          arguments:
            - allowTypesBefore: "*testing.T" # comma-separated list of types that may be before 'context.Context'
        - name: context-keys-type # Basic types should not be used as a key in context.WithValue.
        - name: deep-exit # Packages exposing functions that can stop program execution by exiting are hard to reuse. This rule looks for program exits in functions other than main() or init().
        - name: defer # This rule warns on some common mistakes when using defer statement. It currently alerts on the following situations. See https://github.com/mgechev/revive/blob/master/RULES_DESCRIPTIONS.md#defer
        - name: dot-imports # Importing with . makes the programs much harder to understand because it is unclear whether names belong to the current package or to an imported package.
          severity: error
        - name: duplicated-imports # It is possible to unintentionally import the same package twice. This rule looks for packages that are imported two or more times.
        - name: empty-block # Empty blocks make code less readable and could be a symptom of a bug or unfinished refactoring.
        - name: error-naming # By convention, for the sake of readability, variables of type error must be named with the prefix err.
        - name: error-return # By convention, for the sake of readability, the errors should be last in the list of returned values by a function.
        - name: error-strings # By convention, for better readability, error messages should not be capitalized or end with punctuation or a newline.
          severity: error
        - name: errorf # It is possible to get a simpler program by replacing errors.New(fmt.Sprintf()) with fmt.Errorf(). This rule spots that kind of simplification opportunities.
        - name: exported # Exported function and methods should have comments. This warns on undocumented exported functions and methods.
          severity: error
          arguments:
            - "sayRepetitiveInsteadOfStutters" # replaces the use of the term stutters by repetitive in failure messages
        - name: get-return # Typically, functions with names prefixed with Get are supposed to return a value.
        - name: if-return # Checking if an error is nil to just after return the error or nil is redundant.
        - name: increment-decrement # By convention, for better readability, incrementing an integer variable by 1 is recommended to be done using the ++ operator. This rule spots expressions like i += 1 and i -= 1 and proposes to change them into i++ and i--.
        - name: indent-error-flow # To improve the readability of code, it is recommended to reduce the indentation as much as possible. This rule highlights redundant else-blocks that can be eliminated from the code.
        - name: package-comments # Packages should have comments. This rule warns on undocumented packages and when packages comments are detached to the package keyword.
        - name: range # This rule suggests a shorter way of writing ranges that do not use the second value.
        - name: range-val-in-closure # Range variables in a loop are reused at each iteration; therefore a goroutine created in a loop will point to the range variable with from the upper scope. This way, the goroutine could use the variable with an undesired value. This rule warns when a range value (or index) is used inside a closure.
        - name: range-val-address # Range variables in a loop are reused at each iteration. This rule warns when assigning the address of the variable, passing the address to append() or using it in a map.
        - name: receiver-naming # By convention, receiver names in a method should reflect their identity. For example, if the receiver is of type Parts, p is an adequate name for it. Contrary to other languages, it is not idiomatic to name receivers as this or self.
        - name: redefines-builtin-id # Constant names like false, true, nil, function names like append, make, and basic type names like bool, and byte are not reserved words of the language; therefore the can be redefined. Even if possible, redefining these built in names can lead to bugs very difficult to detect.
        - name: string-of-int # explicit type conversion string(i) where i has an integer type other than rune might behave not as expected by the developer (e.g. string(42) is not "42"). This rule spot that kind of suspicious conversions.
        - name: struct-tag # Struct tags are not checked at compile time. This rule, checks and warns if it finds errors in common struct tags types like: asn1, default, json, protobuf, xml, yaml.
        - name: superfluous-else # To improve the readability of code, it is recommended to reduce the indentation as much as possible. This rule highlights redundant else-blocks that can be eliminated from the code.
        - name: time-equal # This rule warns when using == and != for equality check time.Time and suggest to time.time.Equal method.
        - name: time-naming # Using unit-specific suffix like "Secs", "Mins", ... when naming variables of type time.Duration can be misleading, this rule highlights those cases.
          severity: error
        - name: var-naming # This rule warns when initialism, variable or package naming conventions are not followed.
        - name: var-declaration # This rule proposes simplifications of variable declarations.
        - name: unconditional-recursion # Unconditional recursive calls will produce infinite recursion, thus program stack overflow. This rule detects and warns about unconditional (direct) recursive calls.
        - name: unexported-return # This rule warns when an exported function or method returns a value of an un-exported type.
        - name: unnecessary-stmt # This rule suggests to remove redundant statements like a break at the end of a case block, for improving the code's readability.
        - name: unreachable-code # This rule spots and proposes to remove unreachable code.
          severity: error
        - name: unused-parameter # This rule warns on unused parameters. Functions or methods with unused parameters can be a symptom of an unfinished refactoring or a bug.
        - name: unused-receiver # This rule warns on unused method receivers. Methods with unused receivers can be a symptom of an unfinished refactoring or a bug.
        - name: use-any # Since Go 1.18, interface{} has an alias: any. This rule proposes to replace instances of interface{} with any.
        - name: useless-break # This rule warns on useless break statements in case clauses of switch and select statements. Go, unlike other programming languages like C, only executes statements of the selected case while ignoring the subsequent case clauses. Therefore, inserting a break at the end of a case clause has no effect.
        - name: waitgroup-by-value # Function parameters that are passed by value, are in fact a copy of the original argument. Passing a copy of a sync.WaitGroup is usually not what the developer wants to do. This rule warns when a sync.WaitGroup expected as a by-value parameter in a function or method.

    tagliatelle:
      case:
        use-field-name: false
        rules:
          json: snake

    whitespace:
      multi-if: true
      multi-func: false

    wrapcheck:
      ignore-sig-regexps:
        - "github.com/codeliter/codeforge"

  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: (.+)\.go$
        text: declaration of "(err|ctx)" shadows declaration at
      - path: (.+)\.go$
        text: legacy
      - path: (.+)\.go$
        text: multi-line statement should be followed by a newline
      - path: (.+)\.go$
        text: avoid package names that conflict with Go standard library package names
    paths:
      - .*proto.*
      - .*mocks.*
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/codeliter/codeforge
  exclusions:
    generated: lax
    paths:
      - .*proto.*
      - .*mocks.*
      - third_party$
      - builtin$
      - examples$


output:
  show-stats: false

issues:
  max-issues-per-linter: 0 # Disabled so every issue in changed lines is reported.
  max-same-issues: 0 # Disabled so every issue in changed lines is reported.
