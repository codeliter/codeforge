# Example only: choose models available to your authenticated Empryo providers.
# Save globally as ~/.codeforge/config.yaml or per-project as .codeforge/config.yaml.
# Model names resolve through the primary provider; DevPass aliases llmgateway.
providers:
  primary: devpass
  fallbacks:   # tried in this order; set them with codeforge provider set
    - copilot

# A backup uses the same named model, or its closest model of the same level when it lacks it.
# Normal launches only verify.
# Run codeforge models apply to choose scope, preview and confirm native fallback changes.
# Omit fallbacks to inherit native policy without a Codeforge backup preference.
# The older single "fallback: copilot" key still works and comes first.
model: Sonnet 5.5
expert: Opus 5.5
judges:
  - Haiku 5.5
  - gpt-6-luna
review:
  model: gpt-6.1-sol
  second_opinion:
    - gemini-3.8-flash
init: Sonnet 5.5

# Explicit provider/model values are advanced overrides; they keep native fallback.
# expert: copilot/claude-opus-5.5

# Optional profile routing. Omitted project jobs inherit global Codeforge routing.
# In a project override, an empty string resets that job to native Empryo routing.
routing:
  research: gpt-6-luna
  editing: Sonnet 5.5
  verify: gpt-6.1-sol
  summaries: gpt-6-luna
